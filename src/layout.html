<!doctype html>
<html lang="es" data-title-en="{{title_en}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{desc}}" data-meta-en="{{desc_en}}">
<link rel="canonical" href="{{url}}">
<meta name="theme-color" content="#f2f1ec">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{desc}}">
<meta property="og:image" content="{{domain}}/assets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Logo de Turismo Chiloé Mágico sobre el columpio del lago Huillinco">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_CL">
<meta property="og:url" content="{{url}}">
<meta property="og:site_name" content="Turismo Chiloé Mágico">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/brand/logo/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/brand/logo/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/brand/logo/favicon-180.png">
<link rel="preload" href="/assets/fonts/anton-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/montserrat-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/montserrat-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/montserrat-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
{{preload}}
<link rel="stylesheet" href="/css/main.css">
<script>try{if(localStorage.getItem('cm-lang')==='en')document.documentElement.lang='en'}catch(e){}document.documentElement.classList.add('js')</script>
<script type="application/ld+json">{{jsonld}}</script>
</head>
<body class="{{body_class}}">
<a class="skip" href="#main"><span data-l="es">Saltar al contenido</span><span data-l="en">Skip to content</span></a>
{{header}}
<main id="main" tabindex="-1">
{{content}}
</main>
{{footer}}
{{wa}}
<script src="/vendor/gsap.min.js" defer></script>
<script src="/vendor/ScrollTrigger.min.js" defer></script>
<script src="/vendor/lenis.min.js" defer></script>
<script src="/js/main.js" defer></script>
</body>
</html>
